name: Publish npm packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate tarballs without publishing (disable only on a vX.Y.Z tag)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  publish:
    if: github.repository == 'fenwei-dev/needle.js'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for OIDC support
        run: npm install --global npm@11 --ignore-scripts --no-audit --no-fund

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Validate release version and tag
        run: bun run release:check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspaces and release tooling
        run: bun run typecheck

      - name: Test workspaces and release tooling
        run: bun run test

      - name: Pack and smoke-test all three packages
        run: bun run test:package

      - name: Upload validated tarballs
        uses: actions/upload-artifact@v6
        with:
          name: npm-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Dry-run npm publication
        if: env.RELEASE_DRY_RUN == 'true'
        run: bun run release:dry-run

      - name: Publish to npm with provenance
        if: env.RELEASE_DRY_RUN != 'true'
        run: bun run release:publish
        env:
          # Optional, only for bootstrapping packages before trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
