name: Validate package release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Test workspaces
        run: bun run test

      - name: Pack and test all three packages in a clean consumer
        run: bun run test:package

      - name: Upload validated tarballs
        uses: actions/upload-artifact@v6
        with:
          name: npm-packages-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
